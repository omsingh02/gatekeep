name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint
      - run: npm run build

  migrations:
    # Applies every migration, in order, to a fresh Supabase Postgres (same image as hosted projects)
    runs-on: ubuntu-latest
    services:
      db:
        image: supabase/postgres:17.6.1.063
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Stub storage.buckets (created by the storage service on hosted Supabase)
        run: |
          psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS storage.buckets (
              id text PRIMARY KEY, name text NOT NULL, public boolean DEFAULT false, owner uuid,
              created_at timestamptz DEFAULT now(), updated_at timestamptz DEFAULT now(),
              file_size_limit bigint, allowed_mime_types text[]);
            GRANT ALL ON storage.buckets TO postgres;"
      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -1 -f "$f"
            echo "::endgroup::"
          done

  e2e:
    # Real browser against the real app and a local Supabase (auth, storage, database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor
      - run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests (seeds demo data, builds and starts the app)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
